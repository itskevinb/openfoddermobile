<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open Fodder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas#canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
            outline: none;
            max-width: 100vw;
            max-height: 100vh;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: #fff;
        }
        #loading-screen h1 { font-size: 24px; margin-bottom: 20px; }
        #loading-bar-container { width: 200px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        #loading-bar { width: 0%; height: 100%; background: #4a9; transition: width 0.2s; }
        #loading-status { margin-top: 10px; font-size: 14px; color: #888; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1>Open Fodder</h1>
        <div id="loading-bar-container"><div id="loading-bar"></div></div>
        <div id="loading-status">Loading...</div>
    </div>

    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script>
    var Module = {
        canvas: document.getElementById('canvas'),
        onRuntimeInitialized: function() {
            document.getElementById('loading-screen').style.display = 'none';
        },
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        setStatus: function(text) {
            var statusEl = document.getElementById('loading-status');
            var barEl = document.getElementById('loading-bar');
            if (!text) { statusEl.textContent = 'Ready'; barEl.style.width = '100%'; return; }
            var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
            if (match) {
                var progress = (parseInt(match[2]) / parseInt(match[4])) * 100;
                barEl.style.width = progress + '%';
                statusEl.textContent = match[1].trim();
            } else {
                statusEl.textContent = text;
            }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
            this.totalDependencies = Math.max(this.totalDependencies, left);
            if (left) {
                Module.setStatus('Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
            } else {
                Module.setStatus('');
            }
        }
    };
    Module.setStatus('Loading...');
    window.onerror = function() { Module.setStatus('Error loading game'); };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
